<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar Hitung Yuk!</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Reset & Base */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Quicksand',sans-serif;
  background:#a8e6cf;
  background-image: radial-gradient(circle at 50% 0%, #dcedc1 0%, #a8e6cf 50%, #ffd3b6 100%);
  min-height:100vh;
  color:#333;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}

/* Floating Animations */
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(3deg); }
  100% { transform: translateY(0) rotate(0deg); }
}
@keyframes cloudMove {
  0% { transform: translateX(-10vw); opacity: 0; }
  20% { opacity: 0.8; }
  80% { opacity: 0.8; }
  100% { transform: translateX(110vw); opacity: 0; }
}

/* Decor */
.bg-decor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.6; filter: blur(2px); animation: cloudMove linear infinite; }
.cloud::before, .cloud::after { content: ''; position: absolute; background: white; border-radius: 50%; }
.cloud1 { width: 120px; height: 40px; top: 10%; left: -20%; animation-duration: 45s; }
.cloud1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
.cloud1::after { width: 40px; height: 40px; top: -15px; left: 65px; }
.cloud2 { width: 160px; height: 50px; top: 25%; left: -30%; animation-duration: 35s; animation-delay: -10s; }
.cloud2::before { width: 80px; height: 80px; top: -40px; left: 20px; }
.cloud2::after { width: 50px; height: 50px; top: -20px; left: 85px; }

/* Header / Hero */
header {
  text-align:center;
  margin: 30px 10px 20px;
  position:relative;
  z-index: 10;
  animation: floatUp 6s ease-in-out infinite;
}
h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 48px;
  color: #ff8b94;
  text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.1);
  letter-spacing: 2px;
  line-height: 1.1;
  margin-bottom: 5px;
}
h1 .star { color: #ffeb3b; text-shadow: none; font-size: 38px; }
.kids {
  display:block;
  font-size:22px;
  color:#438676;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  margin-top: 5px;
}
.sub {
  font-size:16px;
  color:#555;
  font-weight:600;
  margin-top: 10px;
  background: rgba(255,255,255,0.6);
  display: inline-block;
  padding: 8px 16px;
  border-radius: 20px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

/* Main Container */
main {
  width: 100%;
  max-width: 650px;
  padding: 0 15px;
  position: relative;
  z-index: 10;
  margin-bottom: 50px;
}
.board {
  background: white;
  border: 6px solid #ffaaa5;
  border-radius: 35px;
  box-shadow: 0 15px 35px rgba(255,139,148,0.3), 0 8px 0 #ff8b94;
  padding: 25px;
  position: relative;
}

/* Tabs */
.tabs{ display:flex; gap:10px; margin-bottom:20px; background:#f9f9f9; padding:8px; border-radius:22px; box-shadow: inset 0 3px 6px rgba(0,0,0,0.05); }
.tab{
  flex:1; padding:12px 5px; border:none; border-radius:16px;
  font-size:16px; font-weight:700; cursor:pointer; transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  background:white; color:#777; box-shadow:0 4px 6px rgba(0,0,0,0.05);
  font-family: 'Quicksand', sans-serif;
}
.tab:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
.tab.active{
  background: #ff8b94; color:#fff; font-size:17px;
  box-shadow: 0 6px 15px rgba(255,139,148,0.4), 0 4px 0 #e6737c;
  transform: translateY(-2px);
}
.tab.active:active { transform: translateY(2px); box-shadow: 0 0 0 #e6737c; }

/* Inputs */
.input-row{ display:flex; gap:12px; margin-bottom:15px; align-items:center; justify-content:center; }
.input-row input{
  flex:1; max-width: 200px; padding:15px 10px; border:4px solid #ffaaa5; border-radius:20px;
  font-size:26px; font-weight:700; background:#fff; text-align:center;
  font-family: 'Fredoka One', cursive; color:#444; transition:all .2s;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
}
.input-row input:focus{ outline:none; border-color:#ff8b94; transform: scale(1.02); box-shadow: 0 0 15px rgba(255,139,148,0.4); }
.input-row label{ font-size:30px; color:#ff8b94; font-weight:900; font-family:'Fredoka One',cursive; }

/* Button Go */
.btn-go{
  width:100%; padding:18px; border:none; border-radius:22px;
  background: #ffd3b6; background-image: linear-gradient(180deg, #ffebcb, #ffd3b6);
  color: #d16b3f; font-size:24px; font-family:'Fredoka One',cursive; cursor:pointer;
  transition:all .2s; box-shadow: 0 8px 0 #e5a47e, 0 15px 20px rgba(229,164,126,0.4);
  letter-spacing:1px; margin-bottom:20px;
}
.btn-go:hover{ transform:translateY(-3px); box-shadow: 0 11px 0 #e5a47e, 0 15px 25px rgba(229,164,126,0.5); }
.btn-go:active{ transform:translateY(5px); box-shadow: 0 3px 0 #e5a47e, 0 5px 10px rgba(229,164,126,0.4); }

/* Paper (Simulation Area) */
.paper-head{ display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#ff8b94; margin-bottom:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
.paper{
  background: #fffdf5; border:4px solid #ffaaa5; border-radius:22px; padding:20px;
  min-height:220px; max-height:55vh; overflow-y:auto; margin-bottom:15px;
  box-shadow: inset 0 5px 15px rgba(0,0,0,0.03);
  position: relative;
}
/* Watermark/Lines on paper */
.paper::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(180deg, transparent, transparent 39px, #e8f4f8 39px, #e8f4f8 40px);
  pointer-events: none; z-index: 0;
}
.step-block { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px dashed #ffcccb; position: relative; z-index: 2; opacity: 0.5; transition: opacity 0.3s; }
.step-block:last-child { border-bottom: none; margin-bottom: 0; }
.step-block.current { opacity: 1; }
.step-sim {
  font-family: 'SF Mono', ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
  font-size: 28px; line-height: 1.8; letter-spacing: 4px;
  white-space: pre; color: #2b2d42; font-weight: 800;
}
.step-txt {
  font-size: 16px; color: #0b525b; font-weight: 700; margin-top: 15px; line-height: 1.5;
  background: #e0fbfc; padding: 12px 18px; border-radius: 12px;
  border-left: 5px solid #118ab2; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
.step-block.current .step-sim { animation: popIn .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { from{opacity:0;transform:scale(0.9) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
.digit { display: inline-block; opacity: 0; animation: fadeInDigit .3s ease-out forwards; color: #d90429; font-weight: 900; text-shadow: 1px 1px 0px rgba(255, 200, 200, 0.5); }
@keyframes fadeInDigit { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.highlight-box {
  box-shadow: 0 0 0 2px #118ab2;
  background: rgba(17,138,178,0.2);
  border-radius: 4px;
  z-index: 10;
  position: relative;
}

/* Controls */
.controls{ display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.controls button{
  flex:1; min-width:90px; padding:15px 5px; border:none; border-radius:18px;
  font-size:16px; font-weight:700; cursor:pointer; transition:all .2s;
  font-family:'Quicksand',sans-serif;
}
.btn-prev{ background:#a8e6cf; color:#2d6a4f; box-shadow:0 6px 0 #7cb39c; }
.btn-prev:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 8px 0 #7cb39c; }
.btn-prev:active:not(:disabled){ transform:translateY(4px); box-shadow:0 2px 0 #7cb39c; }

.btn-play{ background:#06d6a0; color:#fff; box-shadow:0 6px 0 #05a87e; font-size:17px!important; }
.btn-play:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 8px 0 #05a87e; }
.btn-play:active:not(:disabled){ transform:translateY(4px); box-shadow:0 2px 0 #05a87e; }

.btn-reset{ background:#ffd166; color:#a37200; box-shadow:0 6px 0 #d9ad49; }
.btn-reset:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 8px 0 #d9ad49; }
.btn-reset:active:not(:disabled){ transform:translateY(4px); box-shadow:0 2px 0 #d9ad49; }
.controls button:disabled{ opacity:.5; cursor:not-allowed; transform:none!important; box-shadow:none!important; }

/* Speed Row */
.speed-row{
  display:flex; align-items:center; gap:12px;
  font-size:14px; color:#ff8b94; background:#fff2f3; padding:12px 18px; border-radius:18px;
  font-weight:700; border: 2px solid #ffaaa5;
}
.speed-row input[type=range]{ flex:1; accent-color:#ff8b94; cursor:pointer; height:10px; border-radius:5px; }
.speed-label{ white-space:nowrap; min-width:60px; }

/* Footer */
footer { text-align:center; padding: 20px; color: #555; font-weight: 600; font-size: 14px; opacity: 0.8; }
.info { background: white; padding: 8px 16px; border-radius: 20px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

/* Responsive */
@media(max-width:480px){
  h1{font-size:32px;}
  .star{font-size:24px;}
  .kids{font-size:16px;}
  .sub{font-size:12px; padding:6px 12px;}
  .board{padding:15px; border-width: 4px;}
  .tab{font-size:13px; padding:10px 2px;}
  .input-row input{font-size:22px; padding:12px 5px;}
  .btn-go{font-size:20px; padding:15px;}
  .step-sim{font-size:20px;}
  .controls button{font-size:14px; padding:12px 4px;}
}
</style>
</head>
<body>

<div class="bg-decor">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
</div>

<header>
  <h1><span class="star">✨</span> Belajar Hitung <span class="star">✨</span><span class="kids">Kakak Chayra & Adik Annira</span></h1>
  <p class="sub">Matematika jadi mudah dan seru! 🎈</p>
</header>

<main>
<div class="board">
  <div class="tabs">
    <button class="tab active" data-op="tambah">➕ Tambah</button>
    <button class="tab" data-op="kurang">➖ Kurang</button>
    <button class="tab" data-op="kali">✖️ Kali</button>
    <button class="tab" data-op="bagi">➗ Bagi</button>
  </div>

  <div class="input-row">
    <input type="number" step="any" inputmode="decimal" id="num1" placeholder="Angka 1" value="256">
    <label id="opLabel">+</label>
    <input type="number" step="any" inputmode="decimal" id="num2" placeholder="Angka 2" value="178">
  </div>
  
  <button class="btn-go" id="btnGo">🚀 Ayo Hitung!</button>

  <div class="paper-head">
    <span id="stageTitle">Belajar Menambah</span>
    <span id="stepCount">Tahap 0/0</span>
  </div>
  
  <div class="paper" id="paper"></div>

  <div class="controls">
    <button class="btn-prev" id="btnPrev" disabled>◀ Kembali</button>
    <button class="btn-play" id="btnPlay">▶ Main Sendiri</button>
    <button class="btn-reset" id="btnReset">↺ Ulangi</button>
  </div>
  
  <div class="speed-row">
    <span class="speed-label">Kecepatan:</span>
    <input type="range" id="speed" min="1" max="5" value="3">
    <span class="speed-label" id="speedLabel">Normal</span>
  </div>
</div>
</main>

<footer>
  <p class="info">Setiap langkah simulasi akan tampil di layar dan tidak hilang!</p>
</footer>

<script>
// ===== AUDIO =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClick(){
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 720; osc.type = 'sine';
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.12);
  }catch(e){}
}
function playSuccess(){
  try{
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(523, now);
    osc.frequency.setValueAtTime(659, now+0.1);
    osc.frequency.setValueAtTime(784, now+0.2);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  }catch(e){}
}
function playWelcome(){
  try{
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(523, now+0.15);
    osc.frequency.setValueAtTime(659, now+0.3);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now+0.7);
    osc.start(now); osc.stop(now+0.7);
  }catch(e){}
}

// ===== HELPERS =====
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function makeRow(W, ps){
  const r = Array(W).fill(' ');
  for(const p of ps) for(let k=0;k<p.s.length;k++){ const c = p.pos+k; if(c >= 0 && c < W) r[c] = p.s[k]; }
  return r.join('').replace(/\s+$/,'');
}
const COLNAMES = ['satuan','puluhan','ratusan','ribuan','puluhan ribu','ratusan ribu','jutaan'];

// ===== TAMBAH =====
function buildTambah(a, b){
  const s = [];
  const sa = String(a), sb = String(b);
  const dota = sa.indexOf('.'), dotb = sb.indexOf('.');
  const intA = dota >= 0 ? sa.slice(0, dota) : sa;
  const intB = dotb >= 0 ? sb.slice(0, dotb) : sb;
  const decA = dota >= 0 ? sa.slice(dota+1) : '';
  const decB = dotb >= 0 ? sb.slice(dotb+1) : '';
  const maxDec = Math.max(decA.length, decB.length);
  const totalLen = Math.max(intA.length, intB.length) + maxDec;
  
  let strA = intA.padStart(Math.max(intA.length, intB.length), ' ') + decA.padEnd(maxDec, '0');
  let strB = intB.padStart(Math.max(intA.length, intB.length), ' ') + decB.padEnd(maxDec, '0');
  
  const rightCol = 6 + 2 * totalLen + (maxDec > 0 ? 3 : 0);
  const W = rightCol + 4;
  
  const getDisplayRow = (str) => {
    let disp = '';
    for(let i=0; i<str.length; i++) {
      if(str[i] === ' ') disp += '  ';
      else disp += str[i] + ' ';
      if(maxDec > 0 && i === str.length - maxDec - 1) disp += '. ';
    }
    return disp;
  };
  
  let carries = Array(strA.length).fill(' ');
  let results = Array(strA.length).fill(' ');
  let c = 0;
  
  s.push({sim: a+' + '+b+' = ?', txt:'Penjumlahan '+a+' + '+b+'. Susun ke bawah, sejajarkan koma (titik desimal).'});
  
  const baseSim = () => {
    const cDisp = getDisplayRow(carries.join(''));
    const tDisp = getDisplayRow(strA);
    const bDisp = getDisplayRow(strB);
    const rDisp = getDisplayRow(results.join(''));
    
    const baseDispLen = getDisplayRow(strA).length;
    
    let res = [];
    if(cDisp.trim() !== '') res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: cDisp}]));
    res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: tDisp}]));
    res.push(makeRow(W, [{pos: rightCol - baseDispLen - 2, s: '+'}, {pos: rightCol - baseDispLen, s: bDisp}]));
    const barLen = tDisp.trimEnd().length + 2;
    res.push(makeRow(W, [{pos: rightCol - baseDispLen - 2, s: '─'.repeat(barLen)}]));
    if(rDisp.trim() !== '') res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: rDisp}]));
    return res.join('\n');
  };
  
  s.push({sim: baseSim(), txt:'Mulai dari kolom paling kanan.'});
  
  for(let i = strA.length - 1; i >= 0; i--){
    if(strA[i] === ' ' && strB[i] === ' ' && c === 0) break;
    const digitA = strA[i] === ' ' ? 0 : parseInt(strA[i]);
    const digitB = strB[i] === ' ' ? 0 : parseInt(strB[i]);
    const sum = digitA + digitB + c;
    const rDigit = sum % 10;
    const nextC = Math.floor(sum / 10);
    
    results[i] = rDigit.toString();
    
    let txt = `Tambahkan kolom: ${digitA} + ${digitB}`;
    if (c > 0) txt += ` + ${c} (simpanan)`;
    txt += ` = ${sum}. `;
    
    if (nextC > 0) {
      if (i > 0) {
        carries[i-1] = nextC.toString();
        txt += `Tulis ${rDigit}, simpan ${nextC} di kolom berikutnya.`;
      } else {
        results.unshift(nextC.toString());
        carries.unshift(' ');
        strA = ' ' + strA;
        strB = ' ' + strB;
        txt += `Tulis ${sum}.`;
      }
    } else {
      txt += `Tulis ${rDigit}.`;
    }
    
    c = nextC;
    s.push({sim: baseSim(), txt: txt});
  }
  
  let finalRes = results.join('').trim();
  if (maxDec > 0) {
    finalRes = finalRes.slice(0, finalRes.length - maxDec) + '.' + finalRes.slice(finalRes.length - maxDec);
    if (finalRes.startsWith('.')) finalRes = '0' + finalRes;
  }
  s.push({sim: baseSim(), txt:'✓ Hasil akhir: '+a+' + '+b+' = '+finalRes});
  return s;
}

// ===== KURANG =====
function buildKurang(a, b){
  const s = [];
  let isNeg = parseFloat(a) < parseFloat(b);
  let sa = isNeg ? String(b) : String(a);
  let sb = isNeg ? String(a) : String(b);
  
  const dota = sa.indexOf('.'), dotb = sb.indexOf('.');
  const intA = dota >= 0 ? sa.slice(0, dota) : sa;
  const intB = dotb >= 0 ? sb.slice(0, dotb) : sb;
  const decA = dota >= 0 ? sa.slice(dota+1) : '';
  const decB = dotb >= 0 ? sb.slice(dotb+1) : '';
  const maxDec = Math.max(decA.length, decB.length);
  const totalLen = Math.max(intA.length, intB.length) + maxDec;
  
  let strA = intA.padStart(Math.max(intA.length, intB.length), ' ') + decA.padEnd(maxDec, '0');
  let strB = intB.padStart(Math.max(intA.length, intB.length), ' ') + decB.padEnd(maxDec, '0');
  
  const rightCol = 6 + 2 * totalLen + (maxDec > 0 ? 3 : 0);
  const W = rightCol + 4;
  
  let topDigits = strA.split('').map(c => c === ' ' ? 0 : parseInt(c));
  let modified = Array(strA.length).fill(false);
  let results = Array(strA.length).fill(' ');
  
  let introTxt = 'Pengurangan '+a+' - '+b+'. Susun ke bawah, sejajarkan koma.';
  if(isNeg){
    introTxt += ' Karena '+a+' lebih kecil dari '+b+', hasil akan negatif. Kita hitung '+b+' - '+a+' lalu tambahkan minus.';
  }
  s.push({sim: a+' - '+b+' = ?', txt: introTxt});
  
  const getDisplayRow = (arr, isTopStr = false) => {
    let disp = '';
    for(let i=0; i<arr.length; i++) {
      let char = arr[i];
      if (char === ' ' || char === null || char === false) disp += '  ';
      else {
        let charStr = String(char);
        if (isTopStr && modified[i] && charStr !== ' ') {
            disp += charStr + '\u0336 '; 
        } else {
            if (charStr.length > 1) {
                disp += charStr; 
            } else {
                disp += charStr + ' ';
            }
        }
      }
      if(maxDec > 0 && i === arr.length - maxDec - 1) disp += '. ';
    }
    return disp;
  };
  
  const baseSim = () => {
    let borrowArr = Array(strA.length).fill(' ');
    for(let i=0; i<strA.length; i++){
      if(modified[i]) borrowArr[i] = topDigits[i].toString();
    }
    const cDisp = getDisplayRow(borrowArr);
    const tDisp = getDisplayRow(strA.split(''), true);
    const bDisp = getDisplayRow(strB.split(''));
    const rDisp = getDisplayRow(results);
    
    const baseDispLen = getDisplayRow(strA.split('')).length;
    
    let res = [];
    if(cDisp.trim() !== '') res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: cDisp}]));
    res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: tDisp}]));
    res.push(makeRow(W, [{pos: rightCol - baseDispLen - 2, s: '-'}, {pos: rightCol - baseDispLen, s: bDisp}]));
    const barLen = getDisplayRow(strA.split('')).trimEnd().length + 2;
    res.push(makeRow(W, [{pos: rightCol - baseDispLen - 2, s: '─'.repeat(barLen)}]));
    if(rDisp.trim() !== '') res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: rDisp}]));
    return res.join('\n');
  };
  
  s.push({sim: baseSim(), txt:'Mulai dari kolom paling kanan.'});
  
  for(let i = strA.length - 1; i >= 0; i--){
    if(strA[i] === ' ' && strB[i] === ' ' && results[i] === ' ') break;
    let valA = topDigits[i];
    const valB = strB[i] === ' ' ? 0 : parseInt(strB[i]);
    
    if (valA < valB) {
      let bIdx = i - 1;
      while(bIdx >= 0 && topDigits[bIdx] === 0) bIdx--;
      if (bIdx >= 0) {
        for(let j = bIdx; j < i; j++){
          if (j === bIdx) {
            topDigits[j] -= 1;
            modified[j] = true;
          } else {
            topDigits[j] = 9;
            modified[j] = true;
          }
        }
        valA += 10;
        topDigits[i] = valA;
        modified[i] = true;
        s.push({sim: baseSim(), txt: `Angka ${topDigits[i]-10} lebih kecil dari ${valB}. Pinjam 1 dari sebelah kiri, menjadi ${valA}.`});
      }
    }
    
    const diff = valA - valB;
    results[i] = diff.toString();
    
    let txt = `Kurangkan kolom: ${valA} - ${valB} = ${diff}. Tulis ${diff}.`;
    s.push({sim: baseSim(), txt: txt});
  }
  
  let finalRes = results.join('').trim();
  while(finalRes.length > 1 && finalRes.startsWith('0')) {
    finalRes = finalRes.slice(1);
  }
  if (maxDec > 0) {
    if (finalRes.length <= maxDec) {
      finalRes = finalRes.padStart(maxDec + 1, '0');
    }
    finalRes = finalRes.slice(0, finalRes.length - maxDec) + '.' + finalRes.slice(finalRes.length - maxDec);
    if (finalRes.startsWith('.')) finalRes = '0' + finalRes;
  }
  if (isNeg && finalRes !== '0') finalRes = '-' + finalRes;
  
  s.push({sim: baseSim(), txt:'✓ Hasil akhir: '+a+' - '+b+' = '+finalRes});
  return s;
}

// ===== KALI =====
function buildKali(a, b){
  const s = [];
  const sa = String(a), sb = String(b);
  const decA = sa.includes('.') ? sa.length - 1 - sa.indexOf('.') : 0;
  const decB = sb.includes('.') ? sb.length - 1 - sb.indexOf('.') : 0;
  const totalDec = decA + decB;

  const strA = sa.replace('.', '');
  const strB = sb.replace('.', '');
  const intA = parseInt(strA, 10) || 0;
  const intB = parseInt(strB, 10) || 0;

  const lenA = strA.length;
  const lenB = strB.length;
  const maxProdLen = lenA + lenB;
  const rightCol = 4 + 2 * maxProdLen;
  const W = rightCol + 4;

  const posA = rightCol - 2*(lenA - 1);
  const top = makeRow(W, [{pos: posA, s: strA.split('').join(' ')}]);
  
  const posB = rightCol - 2*(lenB - 1);
  const bot = makeRow(W, [{pos: posB - 2, s: '×'}, {pos: posB, s: strB.split('').join(' ')}]);
  
  const barLen = Math.max(lenA, lenB + 1);
  const barPos = rightCol - 2*(barLen - 1);
  const bar = makeRow(W, [{pos: barPos, s: '─'.repeat(2*barLen - 1)}]);

  s.push({sim: a+' × '+b+' = ?', txt:'Perkalian '+a+' × '+b+'.'+(totalDec > 0 ? ' Abaikan koma sementara, kalikan sebagai '+intA+' × '+intB+'.' : '')});
  s.push({sim: [top, bot, bar].join('\n'), txt:'Susun: '+intA+' di atas, '+intB+' di bawah.'});

  const parts = [];
  for(let i = strB.length-1; i >= 0; i--){
    const d = +strB[i];
    const shift = strB.length-1-i;
    const part = intA * d;
    parts.push({part, shift, d});
    
    let arrB = strB.split('');
    arrB[i] = '\u200B' + arrB[i];
    let stepBot = makeRow(W, [{pos: posB - 2, s: '×'}, {pos: posB, s: arrB.join(' ')}]);
    
    const rows = [top, stepBot, bar];
    for(const p of parts){
      const pLen = String(p.part).length;
      const pPos = rightCol - 2*(pLen + p.shift - 1);
      rows.push(makeRow(W, [{pos: pPos, s: String(p.part).split('').join(' ')}]));
    }
    const txt = shift > 0
      ? 'Kalikan digit berikutnya: '+intA+' × '+d+' = '+part+'. Digeser '+shift+' tempat ke kiri.'
      : 'Kalikan digit satuan: '+intA+' × '+d+' = '+part+'. Tulis di baris pertama hasil.';
    s.push({sim: rows.join('\n'), txt: txt});
  }

  if(parts.length > 1){
    let total = 0;
    for(const p of parts) total += p.part * Math.pow(10, p.shift);
    const rows = [top, bot, bar];
    for(const p of parts){
      const pLen = String(p.part).length;
      const pPos = rightCol - 2*(pLen + p.shift - 1);
      rows.push(makeRow(W, [{pos: pPos, s: String(p.part).split('').join(' ')}]));
    }
    const tLen = String(total).length;
    const tBarLen = Math.max(tLen, String(parts[parts.length-1].part).length + parts[parts.length-1].shift);
    const tBarPos = rightCol - 2*(tBarLen - 1);
    rows.push(makeRow(W, [{pos: tBarPos, s: '─'.repeat(2*tBarLen - 1)}]));
    
    const tPos = rightCol - 2*(tLen - 1);
    rows.push(makeRow(W, [{pos: tPos, s: String(total).split('').join(' ')}]));
    
    let finalStr = String(total);
    if(totalDec > 0){
      finalStr = finalStr.padStart(totalDec + 1, '0');
      finalStr = finalStr.slice(0, finalStr.length - totalDec) + '.' + finalStr.slice(finalStr.length - totalDec);
    }
    
    s.push({sim: rows.join('\n'), txt:'Jumlahkan hasil perkalian = '+total+'.'});
    s.push({sim: rows.join('\n'), txt:'✓ Hasil akhir: '+(totalDec > 0 ? 'Kembalikan '+totalDec+' tempat desimal: '+finalStr : a+' × '+b+' = '+total)+'.'});
  } else {
    let total = parts.length === 1 ? parts[0].part : 0;
    let finalStr = String(total);
    if(totalDec > 0){
      finalStr = finalStr.padStart(totalDec + 1, '0');
      finalStr = finalStr.slice(0, finalStr.length - totalDec) + '.' + finalStr.slice(finalStr.length - totalDec);
    }
    const tLen = String(total).length;
    const tPos = rightCol - 2*(tLen - 1);
    s.push({sim: [top, bot, bar, makeRow(W, [{pos: tPos, s: String(total).split('').join(' ')}])].join('\n'), txt:'✓ Hasil akhir: '+(totalDec > 0 ? 'Kembalikan '+totalDec+' tempat desimal: '+finalStr : a+' × '+b+' = '+total)+'.'});
  }
  return s;
}

// ===== BAGI (POROGAPIT INDONESIA) =====
function buildBagi(dividend, divisor){
  const s = [];
  const decA = String(dividend).includes('.') ? String(dividend).length - 1 - String(dividend).indexOf('.') : 0;
  const decB = String(divisor).includes('.') ? String(divisor).length - 1 - String(divisor).indexOf('.') : 0;
  const shift = Math.max(decA, decB);
  
  if (shift > 0) {
    const mult = Math.pow(10, shift);
    dividend = Math.round(dividend * mult);
    divisor = Math.round(divisor * mult);
    s.push({sim: ` \n `, txt: `Karena ada desimal, kalikan kedua angka dengan ${mult} menjadi ${dividend} ÷ ${divisor}.`});
  }

  const n = String(dividend).length;
  const MAX_DEC = 5;
  const intDigits = String(dividend).split('').map(Number);
  const steps = [];
  let sisa = 0, j = 0, decCount = 0;
  while(true){
    if(j < intDigits.length){
      sisa = sisa*10 + intDigits[j];
    } else {
      if(decCount >= MAX_DEC) break;
      decCount++;
      sisa = sisa*10;
    }
    const q = Math.floor(sisa/divisor);
    const r = sisa%divisor;
    steps.push({j, sisaStr:String(sisa), q, prod:q*divisor, r, dec: j >= intDigits.length});
    sisa = r;
    j++;
    if(j >= intDigits.length && r === 0) break;
  }

  const divStr = String(divisor);
  const divLen = divStr.length;
  const basePos = divLen + 3;
  const off = c => basePos + 2*c;

  const qRow = (nSlots, decSoFar, upto) => {
    const W = basePos + 2*(nSlots + decSoFar) + 3;
    const qc = Array(W).fill(' ');
    for(let c = 0; c < nSlots; c++) qc[off(c)] = c <= upto ? steps[c].q : '_';
    if(decSoFar > 0){
      qc[off(nSlots)] = ',';
      for(let k = 1; k <= decSoFar; k++) qc[off(nSlots+k)] = steps[nSlots-1+k].q;
    }
    return qc.join('');
  };

  const renderAll = (upto) => {
    const decSoFar = Math.max(0, upto - n + 1);
    const ds = n + decSoFar;
    const W = basePos + 2*ds + 3;
    const lines = [
      qRow(n, decSoFar, upto),
      makeRow(W, [{pos:basePos-2, s:'┌'+'─'.repeat(2*ds+1)}]),
      makeRow(W, [{pos:0, s:divStr}, {pos:basePos-2, s:'│'}, {pos:basePos, s:[...intDigits, ...Array(decSoFar).fill(0)].join(' ')}])
    ];
    for(let u = 0; u <= upto; u++){
      const su = steps[u];
      const L = su.sisaStr.length;
      const left = off(su.j) - 2*(L-1);
      lines.push(makeRow(W, [{pos:left, s:su.sisaStr.split('').join(' ')}]));
      const prodStr = String(su.prod);
      lines.push(makeRow(W, [{pos:off(su.j) - 2*(prodStr.length-1), s:prodStr.split('').join(' ')}]));
      lines.push(makeRow(W, [{pos:left, s:'─'.repeat(2*L-1)}]));
      const rStr = String(su.r);
      lines.push(makeRow(W, [{pos:off(su.j) - 2*(rStr.length-1), s:rStr.split('').join(' ')}]));
    }
    return lines.join('\n');
  };

  s.push({sim: renderAll(-1), txt:'Bentuk porogapit Indonesia: pembagi '+divisor+' di kiri, garis tegak │, bilangan yang dibagi '+dividend+' di kanan. Siapkan '+n+' tempat hasil di atas atap.'});

  for(let t = 0; t < steps.length; t++){
    const st = steps[t];
    const bisa = st.sisa >= divisor;
    const intro = st.dec
      ? 'Karena masih ada sisa, tulis koma di hasil lalu turunkan angka 0: '
      : (t === 0 ? 'Digit pertama: ' : 'Turunkan digit berikutnya: ');
    const txtA = bisa
      ? st.sisaStr+' ÷ '+divisor+' = '+st.q+'. Tulis '+st.q+(st.dec ? ' setelah koma' : ' di hasil')+'.'
      : 'Tidak bisa dibagi '+divisor+'. Tulis 0'+(st.dec ? ' setelah koma' : ' di hasil')+'.';
    const txtB = st.q+' × '+divisor+' = '+st.prod+'. '+st.sisaStr+' − '+st.prod+' = '+st.r+'.';
    const decSoFar = Math.max(0, st.j - n + 1);
    const txtC = st.dec
      ? ' Sekarang sudah '+decSoFar+' angka di belakang koma.'
      : (t < steps.length-1 ? ' Sisa '+st.r+', lanjut ke digit berikutnya.' : ' Sisa '+st.r+'.');
    s.push({sim: renderAll(t), txt: intro + st.sisaStr + '. ' + txtA + ' ' + txtB + txtC});
  }

  const intQ = steps.slice(0, n).map(x => x.q).join('').replace(/^0+/, '') || '0';
  const decQ = steps.slice(n).map(x => x.q).join('');
  const finalQ = decQ ? intQ + ',' + decQ : intQ;
  const decTotal = steps.length - n;
  const last = steps.length - 1;
  s.push({sim: renderAll(last), txt:'✓ Hasil akhir = '+finalQ+(decQ ? ' (tepat sampai '+decTotal+' angka di belakang koma)' : ' (tepat, tanpa sisa!)')+'.'});
  return s;
}

// ===== STATE =====
let operasi = 'tambah', steps = [], stepIdx = 0, autoTimer = null, isAutoMode = false;

const speedNames = ['Paling Cepat','Cepat','Biasa','Lambat','Paling Lambat'];
document.getElementById('speed').addEventListener('change', e => {
  document.getElementById('speedLabel').textContent = speedNames[e.target.value - 1];
});

function genSteps(){
  const n1 = parseFloat(document.getElementById('num1').value);
  const n2 = parseFloat(document.getElementById('num2').value);
  if(isNaN(n1) || isNaN(n2)){ alert('Tulis angka dulu ya!'); return; }
  const a = Math.abs(n1), b = Math.abs(n2);

  if(operasi === 'tambah') steps = buildTambah(a, b);
  else if(operasi === 'kurang') steps = buildKurang(Math.max(a,b), Math.min(a,b));
  else if(operasi === 'kali') steps = buildKali(a, b);
  else if(operasi === 'bagi') steps = buildBagi(a, Math.max(b,1));

  stepIdx = 0; isAutoMode = false;
  document.getElementById('btnPrev').disabled = true;
  document.getElementById('btnPlay').textContent = '▶ Main Sendiri';
  stopAuto();
  renderPaper();
}

function renderPaper(){
  const paper = document.getElementById('paper');
  paper.innerHTML = '';
  
  for(let i = 0; i <= stepIdx && i < steps.length; i++){
    const st = steps[i];
    const div = document.createElement('div');
    div.className = 'step-block' + (i === stepIdx ? ' current' : '');
    const simText = esc(st.sim);
    div.innerHTML = `<div class="step-sim">${animateDigits(simText)}</div><div class="step-txt">${esc(st.txt)}</div>`;
    paper.appendChild(div);
  }
  
  document.getElementById('stepCount').textContent = 'Tahap '+(stepIdx+1)+'/'+steps.length;
  document.getElementById('btnPrev').disabled = stepIdx === 0;
  if(stepIdx >= steps.length-1){
    document.getElementById('btnPlay').textContent = '✓ Selesai';
  }else if(!isAutoMode){
    document.getElementById('btnPlay').textContent = '▶ Main Sendiri';
  }
  
  paper.scrollTop = paper.scrollHeight;
}

function animateDigits(text){
  let digitCount = 0;
  return text.replace(/\u200B?(\d)/g, (m, d) => {
    let isHighlight = m.startsWith('\u200B');
    let cls = isHighlight ? "digit highlight-box" : "digit";
    return `<span class="${cls}" style="animation-delay:${digitCount++ * 0.08}s">${d}</span>`;
  });
}

function nextStep(){ if(stepIdx < steps.length-1){stepIdx++; renderPaper(); stopAuto(); playClick();} else if(stepIdx === steps.length-1) playSuccess(); }
function prevStep(){ if(stepIdx > 0){stepIdx--; renderPaper(); stopAuto(); playClick();} }
function resetSim(){ stepIdx = 0; renderPaper(); stopAuto(); isAutoMode = false; playClick(); }
function stopAuto(){ if(autoTimer){clearInterval(autoTimer); autoTimer = null;} }

function autoPlay(){
  isAutoMode = true;
  if(stepIdx >= steps.length-1){ isAutoMode = false; return; }
  stopAuto();
  const speed = parseInt(document.getElementById('speed').value);
  const ms = [800, 1200, 1800, 2500, 3500][speed-1];
  document.getElementById('btnPlay').textContent = '⏸ Sedang Jalan';
  autoTimer = setInterval(() => {
    if(stepIdx >= steps.length-1){
      stopAuto(); isAutoMode = false;
      document.getElementById('btnPlay').textContent = '✓ Selesai';
      return;
    }
    stepIdx++; renderPaper(); playClick();
  }, ms);
}

function togglePlay(){
  if(isAutoMode){ stopAuto(); isAutoMode = false; document.getElementById('btnPlay').textContent = '▶ Otomatis'; }
  else if(stepIdx >= steps.length-1){ resetSim(); }
  else{ autoPlay(); }
}

document.getElementById('btnGo').addEventListener('click', () => { genSteps(); playClick(); });
document.getElementById('btnPlay').addEventListener('click', togglePlay);
document.getElementById('btnPrev').addEventListener('click', prevStep);
document.getElementById('btnReset').addEventListener('click', resetSim);

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    operasi = this.dataset.op;
    const labels = {tambah:'+', kurang:'-', kali:'×', bagi:'÷'};
    const titles = {tambah:'Belajar Menambah', kurang:'Belajar Mengurangi', kali:'Belajar Mengali', bagi:'Belajar Membagi (Porogapit)'};
    document.getElementById('opLabel').textContent = labels[operasi];
    document.getElementById('stageTitle').textContent = titles[operasi];
    document.getElementById('num1').value = {tambah:256, kurang:543, kali:34, bagi:1449}[operasi];
    document.getElementById('num2').value = {tambah:178, kurang:287, kali:12, bagi:7}[operasi];
    stopAuto(); isAutoMode = false; steps = []; stepIdx = 0; renderPaper(); playClick();
  });
});

document.getElementById('num1').addEventListener('keypress', e => {if(e.key === 'Enter'){genSteps(); playClick();}});
document.getElementById('num2').addEventListener('keypress', e => {if(e.key === 'Enter'){genSteps(); playClick();}});

genSteps();
