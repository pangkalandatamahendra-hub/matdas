<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Belajar Hitung Bersama Sensei!</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Reset & Base */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Quicksand',sans-serif;
  background:#a8e6cf;
  background-image: radial-gradient(circle at 50% 0%, #dcedc1 0%, #a8e6cf 50%, #ffd3b6 100%);
  min-height:100vh;
  color:#333;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
  padding: 0 10px;
}

/* Floating Animations */
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(2deg); }
  100% { transform: translateY(0) rotate(0deg); }
}
@keyframes cloudMove {
  0% { transform: translateX(-10vw); opacity: 0; }
  20% { opacity: 0.8; }
  80% { opacity: 0.8; }
  100% { transform: translateX(110vw); opacity: 0; }
}

/* Background Decor */
.bg-decor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.6; filter: blur(2px); animation: cloudMove linear infinite; }
.cloud::before, .cloud::after { content: ''; position: absolute; background: white; border-radius: 50%; }
.cloud1 { width: 120px; height: 40px; top: 8%; left: -20%; animation-duration: 45s; }
.cloud1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
.cloud1::after { width: 40px; height: 40px; top: -15px; left: 65px; }
.cloud2 { width: 160px; height: 50px; top: 22%; left: -30%; animation-duration: 35s; animation-delay: -10s; }
.cloud2::before { width: 80px; height: 80px; top: -40px; left: 20px; }
.cloud2::after { width: 50px; height: 50px; top: -20px; left: 85px; }

/* Header / Hero */
header {
  text-align:center;
  margin: 18px 10px 12px;
  position:relative;
  z-index: 10;
  animation: floatUp 6s ease-in-out infinite;
}
h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 38px;
  color: #ff8b94;
  text-shadow: 3px 3px 0 #fff, 4px 4px 0 rgba(0,0,0,0.08);
  letter-spacing: 1.5px;
  line-height: 1.15;
  margin-bottom: 4px;
}
h1 .star { color: #ffeb3b; text-shadow: none; font-size: 30px; }
.kids {
  display:block;
  font-size:19px;
  color:#2e7d6b;
  font-family: 'Quicksand', sans-serif;
  font-weight: 800;
  margin-top: 3px;
}
.sub {
  font-size:14px;
  color:#555;
  font-weight:700;
  margin-top: 6px;
  background: rgba(255,255,255,0.75);
  display: inline-block;
  padding: 5px 16px;
  border-radius: 20px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

/* Lang Selector */
.lang-selector { margin-bottom: 12px; display: flex; justify-content: center; gap: 8px; z-index: 20; position: relative; flex-wrap: wrap; }
.lang-btn {
  background: white; border: 3px solid #ffaaa5; border-radius: 18px; padding: 6px 16px;
  font-family: 'Quicksand', sans-serif; font-weight: 800; cursor: pointer; transition: all 0.2s;
  color: #555; font-size:14px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
.lang-btn.active {
  background: #ff8b94; color: white; border-color: #e6737c;
  box-shadow: 0 4px 12px rgba(255,139,148,0.4); transform: translateY(-2px);
}
.lang-btn:hover { transform: translateY(-2px); }
.lang-btn:active { transform: translateY(1px); }

/* Main Container */
main {
  width: 100%;
  max-width: 960px;
  position: relative;
  z-index: 10;
  margin-bottom: 35px;
}

/* Classroom Board Card */
.board {
  background: white;
  border: 6px solid #ffaaa5;
  border-radius: 32px;
  box-shadow: 0 15px 35px rgba(255,139,148,0.3), 0 8px 0 #ff8b94;
  padding: 22px;
  position: relative;
  width: 100%;
}

/* Tabs */
.tabs{ display:flex; gap:8px; margin-bottom:16px; background:#f9f9f9; padding:6px; border-radius:20px; box-shadow: inset 0 3px 6px rgba(0,0,0,0.05); }
.tab{
  flex:1; padding:12px 4px; border:none; border-radius:15px;
  font-size:15px; font-weight:800; cursor:pointer; transition:all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  background:white; color:#777; box-shadow:0 3px 6px rgba(0,0,0,0.05);
  font-family: 'Quicksand', sans-serif;
  text-align:center;
}
.tab:hover { transform: translateY(-2px); box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
.tab.active{
  background: #ff8b94; color:#fff; font-size:16px;
  box-shadow: 0 6px 14px rgba(255,139,148,0.4), 0 3px 0 #e6737c;
  transform: translateY(-2px);
}
.tab.active:active { transform: translateY(1px); box-shadow: 0 0 0 #e6737c; }

/* Inputs */
.input-row{ display:flex; gap:10px; margin-bottom:14px; align-items:center; justify-content:center; }
.input-row input{
  flex:1; max-width: 190px; padding:12px 10px; border:4px solid #ffaaa5; border-radius:18px;
  font-size:24px; font-weight:800; background:#fff; text-align:center;
  font-family: 'Fredoka One', cursive; color:#444; transition:all .2s;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
  min-width: 0;
}
.input-row input:focus{ outline:none; border-color:#ff8b94; transform: scale(1.02); box-shadow: 0 0 15px rgba(255,139,148,0.35); }
.input-row label{ font-size:28px; color:#ff8b94; font-weight:900; font-family:'Fredoka One',cursive; flex-shrink: 0; }

/* Main Action Button (Top) */
.btn-go{
  width:100%; padding:15px; border:none; border-radius:20px;
  background: #ffd3b6; background-image: linear-gradient(180deg, #ffebcb, #ffd3b6);
  color: #d16b3f; font-size:22px; font-family:'Fredoka One',cursive; cursor:pointer;
  transition:all .2s; box-shadow: 0 7px 0 #e5a47e, 0 12px 18px rgba(229,164,126,0.4);
  letter-spacing:1px; margin-bottom:18px;
}
.btn-go:hover{ transform:translateY(-3px); box-shadow: 0 10px 0 #e5a47e, 0 14px 22px rgba(229,164,126,0.5); }
.btn-go:active{ transform:translateY(4px); box-shadow: 0 3px 0 #e5a47e, 0 5px 10px rgba(229,164,126,0.4); }

/* CLASSROOM STAGE: Sensei on the LEFT, Blackboard on the RIGHT (Always Beside Each Other!) */
.classroom-stage {
  display: flex;
  gap: 16px;
  align-items: flex-end;
  margin-bottom: 16px;
  width: 100%;
}

/* Left Column: Sensei & Speech Bubble */
.sensei-col {
  width: 190px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

/* Speech Bubble pointing down to Sensei */
.speech-bubble {
  background: white;
  border: 4px solid #118ab2;
  border-radius: 20px;
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 700;
  color: #0f4c5c;
  position: relative;
  margin-bottom: 14px;
  box-shadow: 0 6px 18px rgba(17,138,178,0.18);
  animation: popIn 0.3s ease-out;
  text-align: center;
  font-family: 'Quicksand', sans-serif;
  line-height: 1.45;
  width: 100%;
}
.speech-bubble::after {
  content: ''; position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
  border-width: 13px 10px 0; border-style: solid; border-color: #118ab2 transparent transparent transparent;
}
.speech-bubble::before {
  content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
  border-width: 8px 7px 0; border-style: solid; border-color: white transparent transparent transparent; z-index: 1;
}

/* Sensei Avatar Animation */
.teacher {
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
}
.teacher:hover { transform: scale(1.05); }

/* Animated Mouth and Pointer Stick */
.teacher.talking #mouth {
  transform-origin: 90px 124px;
  animation: animeMouth 0.2s infinite alternate;
}
.teacher.talking .arm-pointer {
  transform-origin: 120px 145px;
  animation: animePoint 0.5s infinite alternate ease-in-out;
}
.teacher.talking .hair-ribbon {
  transform-origin: 50px 70px;
  animation: ribbonFlutter 0.6s infinite alternate ease-in-out;
}

@keyframes animeMouth {
  0% { transform: scaleY(1) scaleX(1); }
  50% { transform: scaleY(2.2) scaleX(1.15) translateY(1px); }
  100% { transform: scaleY(1.4) scaleX(0.9); }
}
@keyframes animePoint {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-14deg) translateY(-2px); }
}
@keyframes ribbonFlutter {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(8deg); }
}

/* Right Column: Blackboard / Simulation Paper */
.blackboard-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.paper-head{ display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#ff8b94; margin-bottom:8px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; }
.paper{
  background: #fffdf5; border:4px solid #ffaaa5; border-radius:20px; padding:18px;
  min-height:220px; max-height:52vh; overflow-y:auto; overflow-x:auto; margin-bottom:0;
  box-shadow: inset 0 5px 15px rgba(0,0,0,0.03);
  position: relative;
  -webkit-overflow-scrolling: touch;
}
.paper::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(180deg, transparent, transparent 39px, #e8f4f8 39px, #e8f4f8 40px);
  pointer-events: none; z-index: 0;
}
.step-block { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px dashed #ffcccb; position: relative; z-index: 2; opacity: 0.5; transition: opacity 0.3s; }
.step-block:last-child { border-bottom: none; margin-bottom: 0; }
.step-block.current { opacity: 1; }
.step-sim {
  font-family: 'SF Mono', ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
  font-size: 24px; line-height: 1.8; letter-spacing: 3px;
  white-space: pre; color: #2b2d42; font-weight: 800;
}
.step-txt {
  font-size: 14px; color: #0b525b; font-weight: 700; margin-top: 12px; line-height: 1.5;
  background: #e0fbfc; padding: 10px 14px; border-radius: 12px;
  border-left: 5px solid #118ab2; box-shadow: 0 3px 6px rgba(0,0,0,0.04);
}
.step-block.current .step-sim { animation: popIn .35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { from{opacity:0;transform:scale(0.92) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
.digit { display: inline-block; opacity: 0; animation: fadeInDigit .3s ease-out forwards; color: #d90429; font-weight: 900; text-shadow: 1px 1px 0px rgba(255, 200, 200, 0.5); }
@keyframes fadeInDigit { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.highlight-top, .highlight-bot { position: relative; z-index: 5; }
.highlight-top::before {
  content: ''; position: absolute;
  top: -4px; left: -6px; right: -6px; bottom: -14px;
  background: rgba(17,138,178,0.15);
  border: 2px solid #118ab2; border-radius: 8px; z-index: -1;
}
.highlight-bot::before {
  content: ''; position: absolute;
  top: -16px; left: -6px; right: -6px; bottom: -4px;
  background: rgba(17,138,178,0.15);
  border: 2px solid #118ab2; border-top: none;
  border-radius: 0 0 8px 8px; z-index: -1;
}
.strike { position: relative; display: inline-block; }
.strike::after {
  content: ''; position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  background: linear-gradient(to top right, transparent calc(50% - 1.5px), #d90429 calc(50% - 1.5px), #d90429 calc(50% + 1.5px), transparent calc(50% + 1.5px));
  pointer-events: none; z-index: 10;
}

/* Bottom Step Controls: Clear & Unambiguous */
.controls{ display:flex; gap:8px; margin-top:14px; margin-bottom:12px; flex-wrap:wrap; }
.controls button{
  flex:1; min-width:80px; padding:12px 4px; border:none; border-radius:15px;
  font-size:14px; font-weight:800; cursor:pointer; transition:all .2s;
  font-family:'Quicksand',sans-serif; text-align:center;
}
.btn-prev{ background:#a8e6cf; color:#2d6a4f; box-shadow:0 5px 0 #7cb39c; }
.btn-prev:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 7px 0 #7cb39c; }
.btn-prev:active:not(:disabled){ transform:translateY(3px); box-shadow:0 2px 0 #7cb39c; }

.btn-next{ background:#70e000; color:#004b23; box-shadow:0 5px 0 #38b000; font-size:15px!important; }
.btn-next:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 7px 0 #38b000; }
.btn-next:active:not(:disabled){ transform:translateY(3px); box-shadow:0 2px 0 #38b000; }

.btn-auto{ background:#06d6a0; color:#fff; box-shadow:0 5px 0 #05a87e; font-size:14px!important; }
.btn-auto:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 7px 0 #05a87e; }
.btn-auto:active:not(:disabled){ transform:translateY(3px); box-shadow:0 2px 0 #05a87e; }
.btn-auto.playing{ background:#ff5d8f; color:#fff; box-shadow:0 5px 0 #d90429; }

.btn-reset{ background:#ffd166; color:#a37200; box-shadow:0 5px 0 #d9ad49; }
.btn-reset:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 7px 0 #d9ad49; }
.btn-reset:active:not(:disabled){ transform:translateY(3px); box-shadow:0 2px 0 #d9ad49; }

.btn-voice{ background:#9b5de5; color:#fff; box-shadow:0 5px 0 #7b4bc4; }
.btn-voice:hover{ transform:translateY(-2px); box-shadow:0 7px 0 #7b4bc4; }
.btn-voice:active{ transform:translateY(3px); box-shadow:0 2px 0 #7b4bc4; }
.btn-voice.off { background: #e5e5e5; color: #888; box-shadow:0 5px 0 #ccc; }

.controls button:disabled{ opacity:.45; cursor:not-allowed; transform:none!important; box-shadow:none!important; }

/* Speed Row */
.speed-row{
  display:flex; align-items:center; gap:10px;
  font-size:13px; color:#ff8b94; background:#fff2f3; padding:10px 16px; border-radius:16px;
  font-weight:800; border: 2px solid #ffaaa5;
}
.speed-row input[type=range]{ flex:1; accent-color:#ff8b94; cursor:pointer; height:8px; border-radius:4px; }
.speed-label{ white-space:nowrap; min-width:55px; }

/* Footer */
footer { text-align:center; padding: 18px; color: #555; font-weight: 600; font-size: 13px; opacity: 0.85; }
.info { background: white; padding: 8px 16px; border-radius: 20px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

/* RESPONSIVE DESIGN: Sensei ALWAYS Beside Blackboard on All Screen Sizes */
@media(max-width: 768px){
  .classroom-stage { gap: 12px; }
  .sensei-col { width: 135px; }
  .teacher svg { width: 125px; height: 165px; }
  .speech-bubble { font-size: 13px; padding: 10px; }
  .board { padding: 16px; }
  .step-sim { font-size: 21px; letter-spacing: 2px; }
}

@media(max-width: 520px){
  header { margin: 12px 5px 8px; }
  h1 { font-size: 26px; }
  h1 .star { font-size: 20px; }
  .kids { font-size: 14px; }
  .sub { font-size: 12px; padding: 4px 10px; }
  .lang-btn { font-size: 13px; padding: 5px 12px; }
  .board { padding: 12px; border-width: 4px; border-radius: 22px; }
  .tabs { gap: 4px; padding: 4px; }
  .tab { font-size: 12px; padding: 9px 2px; border-radius: 12px; }
  .tab.active { font-size: 12px; }
  .input-row input { font-size: 19px; padding: 9px 4px; border-width: 3px; }
  .input-row label { font-size: 20px; }
  .btn-go { font-size: 17px; padding: 12px; border-radius: 16px; margin-bottom: 12px; }
  
  /* Sensei stays on the left of blackboard */
  .classroom-stage { gap: 8px; align-items: flex-end; }
  .sensei-col { width: 95px; }
  .teacher svg { width: 90px; height: 120px; }
  .speech-bubble {
    font-size: 11.5px; padding: 8px 6px; border-width: 3px; border-radius: 14px;
    margin-bottom: 8px; line-height: 1.35;
  }
  .speech-bubble::after { bottom: -9px; border-width: 9px 7px 0; }
  .speech-bubble::before { bottom: -5px; border-width: 6px 5px 0; }
  
  .paper { min-height: 180px; max-height: 48vh; padding: 10px 8px; border-width: 3px; border-radius: 16px; }
  .step-sim { font-size: 17px; letter-spacing: 1.5px; line-height: 1.6; }
  .step-txt { font-size: 12.5px; padding: 8px 10px; margin-top: 8px; }
  
  .controls { gap: 5px; margin-top: 10px; }
  .controls button { font-size: 12px; padding: 10px 2px; min-width: calc(50% - 5px); border-radius: 12px; }
  .btn-voice { min-width: 100%!important; }
}
</style>
</head>
<body>

<div class="bg-decor">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
</div>

<header>
  <div class="lang-selector">
    <button class="lang-btn active" data-lang="id">🇮🇩 Indonesia</button>
    <button class="lang-btn" data-lang="en">🇬🇧 English</button>
    <button class="lang-btn" data-lang="jv">ꦗꦮ Jawa</button>
  </div>
  <h1><span class="star">✨</span> <span id="titleText">Belajar Hitung</span> <span class="star">✨</span><span class="kids">Kakak Chayra & Adik Annira</span></h1>
  <p class="sub" id="subTitle">Matematika jadi mudah dan seru bersama Sensei! 🎈</p>
</header>

<main>
<div class="board">

  <!-- Math Operation Tabs -->
  <div class="tabs">
    <button class="tab active" data-op="tambah">➕ Tambah</button>
    <button class="tab" data-op="kurang">➖ Kurang</button>
    <button class="tab" data-op="kali">✖️ Kali</button>
    <button class="tab" data-op="bagi">➗ Bagi</button>
  </div>

  <!-- Number Inputs -->
  <div class="input-row">
    <input type="number" step="any" inputmode="decimal" id="num1" placeholder="Angka 1" value="256">
    <label id="opLabel">+</label>
    <input type="number" step="any" inputmode="decimal" id="num2" placeholder="Angka 2" value="178">
  </div>
  
  <!-- Primary Action Button (Top) -->
  <button class="btn-go" id="btnGo">🚀 Mulai Hitung</button>

  <!-- CLASSROOM STAGE: Sensei on the LEFT, Blackboard on the RIGHT -->
  <div class="classroom-stage">
    
    <!-- Left: Sensei & Speech Bubble -->
    <div class="sensei-col">
      <div class="speech-bubble" id="teacherSpeech">Halo! Aku Sensei! Yuk kita mulai belajar berhitung!</div>
      <div class="teacher" id="teacherAvatar" title="Klik aku untuk mengulang penjelasan suara!">
        <!-- Cute Chibi Anime Teacher SVG -->
        <svg width="170" height="225" viewBox="0 0 170 225" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#b07d62"/>
              <stop offset="100%" stop-color="#6f4e37"/>
            </linearGradient>
            <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4361ee"/>
              <stop offset="100%" stop-color="#1e1b4b"/>
            </linearGradient>
            <linearGradient id="blazerGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff8b94"/>
              <stop offset="100%" stop-color="#e6737c"/>
            </linearGradient>
            <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff3b0"/>
              <stop offset="100%" stop-color="#ffd166"/>
            </linearGradient>
          </defs>

          <!-- Back Hair / Ponytails -->
          <g class="hair-ribbon">
            <path d="M35,65 C15,75 5,110 20,135 C28,125 35,100 40,85 Z" fill="url(#hairGrad)"/>
            <circle cx="34" cy="74" r="8" fill="#ff4d6d"/>
            <circle cx="34" cy="74" r="3" fill="#fff"/>
          </g>
          <g>
            <path d="M135,65 C155,75 165,110 150,135 C142,125 135,100 130,85 Z" fill="url(#hairGrad)"/>
            <circle cx="136" cy="74" r="8" fill="#ff4d6d"/>
            <circle cx="136" cy="74" r="3" fill="#fff"/>
          </g>

          <!-- Body & Outfit -->
          <path d="M60,195 L60,220 A5,5 0 0,0 75,220 L75,195 Z" fill="#fff"/>
          <path d="M95,195 L95,220 A5,5 0 0,0 110,220 L110,195 Z" fill="#fff"/>
          <ellipse cx="67" cy="220" rx="9" ry="5" fill="#6f4e37"/>
          <ellipse cx="103" cy="220" rx="9" ry="5" fill="#6f4e37"/>
          <path d="M50,170 L120,170 L130,200 L40,200 Z" fill="#3a5a40"/>

          <!-- Blazer / Torso -->
          <path d="M45,130 Q85,120 125,130 L122,175 L48,175 Z" fill="url(#blazerGrad)"/>
          <polygon points="85,130 65,130 85,155" fill="#fff"/>
          <polygon points="85,130 105,130 85,155" fill="#fff"/>
          <polygon points="75,140 95,140 85,148" fill="#d90429"/>
          <polygon points="75,156 95,156 85,148" fill="#d90429"/>
          <circle cx="85" cy="148" r="3.5" fill="#ffb703"/>

          <!-- Left Arm (Holding Math Book) -->

let currentLang = 'id';
let isVoiceEnabled = true;
let availableVoices = [];
let activeUtterance = null; // Prevent Garbage Collection killing speech!

function t(key, vars = {}) {
  let text = (i18n[currentLang] && i18n[currentLang][key]) || (i18n['id'] && i18n['id'][key]) || key;
  for(let k in vars){ text = text.replace(new RegExp('{'+k+'}','g'), vars[k]); }
  return text;
}

// ===== BULLETPROOF VOICE ENGINE =====
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  try {
    const v = window.speechSynthesis.getVoices();
    if (v && v.length > 0) {
      availableVoices = v;
    }
  } catch(e){}
}

loadVoices();
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    loadVoices();
  };
}

function unlockAudio() {
  try {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    if ('speechSynthesis' in window) {
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
      loadVoices();
    }
  } catch(e){}
}

function getBestVoice(targetLang) {
  if (!availableVoices || availableVoices.length === 0) {
    loadVoices();
  }
  if (!availableVoices || availableVoices.length === 0) return null;
  
  if (targetLang === 'en') {
    return availableVoices.find(v => v.lang === 'en-US' || v.lang === 'en_US') ||
           availableVoices.find(v => v.lang.startsWith('en')) ||
           availableVoices.find(v => v.name.toLowerCase().includes('english') || v.name.toLowerCase().includes('samantha') || v.name.toLowerCase().includes('google us') || v.name.toLowerCase().includes('victoria')) ||
           null;
  }
  
  if (targetLang === 'jv') {
    return availableVoices.find(v => v.lang === 'jv-ID' || v.lang === 'jv_ID' || v.lang.startsWith('jv')) ||
           availableVoices.find(v => v.lang === 'id-ID' || v.lang === 'id_ID' || v.lang.startsWith('id')) ||
           availableVoices.find(v => v.name.toLowerCase().includes('indonesia') || v.name.toLowerCase().includes('damayanti') || v.name.toLowerCase().includes('gadis')) ||
           null;
  }
  
  // Indonesian (id)
  return availableVoices.find(v => v.lang === 'id-ID' || v.lang === 'id_ID' || v.lang.startsWith('id')) ||
         availableVoices.find(v => v.name.toLowerCase().includes('indonesia') || v.name.toLowerCase().includes('damayanti') || v.name.toLowerCase().includes('gadis')) ||
         null;
}

function cleanTextForSpeech(rawText, langCode) {
  let text = rawText;
  
  // Remove emojis & decorative symbols
  text = text.replace(/[✨🎈🚀🦉🎉👍➕➖✖️➗✓]/g, '');
  text = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '');
  text = text.replace(/\{|\}|\[|\]/g, '');
  
  if (langCode === 'en') {
    text = text.replace(/\+/g, ' plus ');
    text = text.replace(/−|-/g, ' minus ');
    text = text.replace(/×|\*/g, ' times ');
    text = text.replace(/÷|\//g, ' divided by ');
    text = text.replace(/=/g, ' equals ');
  } else if (langCode === 'jv') {
    text = text.replace(/\+/g, ' ditambah ');
    text = text.replace(/−|-/g, ' disuda ');
    text = text.replace(/×|\*/g, ' diping ');
    text = text.replace(/÷|\//g, ' diporo ');
    text = text.replace(/=/g, ' podo karo ');
  } else {
    // Indonesian
    text = text.replace(/\+/g, ' tambah ');
    text = text.replace(/−|-/g, ' kurang ');
    text = text.replace(/×|\*/g, ' dikali ');
    text = text.replace(/÷|\//g, ' dibagi ');
    text = text.replace(/=/g, ' sama dengan ');
  }
  
  return text.replace(/\s+/g, ' ').trim();
}

function setTeacherTalking(talking) {
  const tchr = document.getElementById('teacherAvatar');
  if (!tchr) return;
  if (talking) {
    tchr.classList.add('talking');
  } else {
    tchr.classList.remove('talking');
  }
}

let autoStepTimer = null;
let speakDebounceTimer = null;

// Voice-driven auto-play synchronization
function handleSpeechFinished() {
  if (!isAutoMode) return;
  
  if (stepIdx >= steps.length - 1) {
    isAutoMode = false;
    updateUI();
    playSuccess();
    return;
  }
  
  // Pause interval after speech finishes before moving to next step
  const speed = parseInt(document.getElementById('speed').value);
  const pauseIntervals = [400, 750, 1100, 1600, 2400];
  const pauseMs = pauseIntervals[speed - 1] || 1100;
  
  if (autoStepTimer) clearTimeout(autoStepTimer);
  autoStepTimer = setTimeout(() => {
    if (!isAutoMode) return;
    stepIdx++;
    renderPaper(true);
    playClick();
  }, pauseMs);
}

function speakText(text, explicitLang) {
  if (speechAnimTimer) clearTimeout(speechAnimTimer);
  if (autoStepTimer) clearTimeout(autoStepTimer);
  
  const targetLang = explicitLang || currentLang;
  const spoken = cleanTextForSpeech(text, targetLang);
  if (!spoken) {
    handleSpeechFinished();
    return;
  }
  
  // If voice is disabled in UI or Web Speech not supported
  if (!isVoiceEnabled || !('speechSynthesis' in window)) {
    setTeacherTalking(true);
    const readingTime = Math.max(1200, spoken.length * 60);
    speechAnimTimer = setTimeout(() => {
      setTeacherTalking(false);
      handleSpeechFinished();
    }, readingTime);
    return;
  }
  
  unlockAudio();
  
  try {
    // Unpause if stalled
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }
    window.speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(spoken);
    activeUtterance = utterance; // Prevent Garbage Collection!
    
    // Assign language locale (always valid)
    const langMap = { 'id': 'id-ID', 'en': 'en-US', 'jv': 'id-ID' };
    utterance.lang = langMap[targetLang] || 'id-ID';
    
    const voice = getBestVoice(targetLang);
    if (voice) {
      utterance.voice = voice;
    }
    
    utterance.volume = 1.0;
    utterance.rate = 0.95;
    utterance.pitch = (targetLang === 'en') ? 1.1 : 1.15;
    
    utterance.onstart = () => {
      setTeacherTalking(true);
    };
    
    utterance.onend = () => {
      setTeacherTalking(false);
      activeUtterance = null;
      handleSpeechFinished();
    };
    
    utterance.onerror = (e) => {
      console.warn('Speech synthesis event:', e);
      setTeacherTalking(false);
      activeUtterance = null;
      handleSpeechFinished();
    };
    
    // Fallback timer to ensure animations and auto-play don't get stuck
    const maxSpeakTime = Math.max(2000, (spoken.length / 5) * 1000);
    speechAnimTimer = setTimeout(() => {
      setTeacherTalking(false);
    }, maxSpeakTime);
    
    // Speak immediately within the user interaction frame
    window.speechSynthesis.speak(utterance);
    
    // Extra resume call for Chrome quirk
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }
    
  } catch(err) {
    console.warn('Speech execution fallback:', err);
    setTeacherTalking(false);
    handleSpeechFinished();
  }
}

// ===== AUDIO EFFECTS (SOUND FX) =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClick(){
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 720; osc.type = 'sine';
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.12);
  }catch(e){}
}
function playSuccess(){
  try{
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(523, now);
    osc.frequency.setValueAtTime(659, now+0.1);
    osc.frequency.setValueAtTime(784, now+0.2);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  }catch(e){}
}

// ===== HELPERS =====
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function makeRow(W, ps){
  const r = Array(W).fill(' ');
  for(const p of ps) for(let k=0;k<p.s.length;k++){ const c = p.pos+k; if(c >= 0 && c < W) r[c] = p.s[k]; }
  return r.join('').replace(/\s+$/,'');
}

// ===== TAMBAH =====
function buildTambah(a, b){
  const s = [];
  const sa = String(a), sb = String(b);
  const dota = sa.indexOf('.'), dotb = sb.indexOf('.');
  const intA = dota >= 0 ? sa.slice(0, dota) : sa;
  const intB = dotb >= 0 ? sb.slice(dotb+1) : sb;
  const decA = dota >= 0 ? sa.slice(dota+1) : '';
  const decB = dotb >= 0 ? sb.slice(dotb+1) : '';
  const maxDec = Math.max(decA.length, decB.length);
  const totalLen = Math.max(intA.length, intB.length) + maxDec;
  
  let strA = intA.padStart(Math.max(intA.length, intB.length), ' ') + decA.padEnd(maxDec, '0');
  let strB = intB.padStart(Math.max(intA.length, intB.length), ' ') + decB.padEnd(maxDec, '0');
  
  const rightCol = 6 + 2 * totalLen + (maxDec > 0 ? 3 : 0);
  const W = rightCol + 4;
  
  const getDisplayRow = (str) => {
    let disp = '';
    for(let i=0; i<str.length; i++) {
      if(str[i] === ' ') disp += '  ';
      else disp += str[i] + ' ';
      if(maxDec > 0 && i === str.length - maxDec - 1) disp += '. ';
    }
    return disp;
  };
  
  let carries = Array(strA.length).fill(' ');
  let results = Array(strA.length).fill(' ');
  let c = 0;
  
  s.push({sim: a+' + '+b+' = ?', txt: t('tambahIntro', {a,b}) });
  
  const baseSim = () => {
    const cDisp = getDisplayRow(carries.join(''));
    const tDisp = getDisplayRow(strA);
    const bDisp = getDisplayRow(strB);
    const rDisp = getDisplayRow(results.join(''));
    
    const baseDispLen = getDisplayRow(strA).length;
    
    let res = [];
    if(cDisp.trim() !== '') res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: cDisp}]));
    res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: tDisp}]));
    res.push(makeRow(W, [{pos: rightCol - baseDispLen - 2, s: '+'}, {pos: rightCol - baseDispLen, s: bDisp}]));
    const barLen = tDisp.trimEnd().length + 2;
    res.push(makeRow(W, [{pos: rightCol - baseDispLen - 2, s: '─'.repeat(barLen)}]));
    if(rDisp.trim() !== '') res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: rDisp}]));
    return res.join('\n');
  };
  
  s.push({sim: baseSim(), txt: t('tambahMulai') });
  
  for(let i = strA.length - 1; i >= 0; i--){
    if(strA[i] === ' ' && strB[i] === ' ' && c === 0) break;
    const digitA = strA[i] === ' ' ? 0 : parseInt(strA[i]);
    const digitB = strB[i] === ' ' ? 0 : parseInt(strB[i]);
    const sum = digitA + digitB + c;
    const rDigit = sum % 10;
    const nextC = Math.floor(sum / 10);
    
    results[i] = rDigit.toString();
    
    let cStr = c > 0 ? t('tambahCarry', {c}) : '';
    let tStr = '';
    
    if (nextC > 0) {
      if (i > 0) {
        carries[i-1] = nextC.toString();
        tStr = t('tambahTulisC', {r:rDigit, nc:nextC});
      } else {
        results.unshift(nextC.toString());
        carries.unshift(' ');
        strA = ' ' + strA;
        strB = ' ' + strB;
        tStr = t('tambahTulisB', {sum});
      }
    } else {
      tStr = t('tambahTulisA', {r:rDigit});
    }
    let txt = t('tambahStep', {da:digitA, db:digitB, cStr, sum, tStr});
    
    c = nextC;
    s.push({sim: baseSim(), txt: txt});
  }
  
  let finalRes = results.join('').trim();
  if (maxDec > 0) {
    finalRes = finalRes.slice(0, finalRes.length - maxDec) + '.' + finalRes.slice(finalRes.length - maxDec);
    if (finalRes.startsWith('.')) finalRes = '0' + finalRes;
  }
  s.push({sim: baseSim(), txt: t('tambahHasil', {a,b,res:finalRes}) });
  return s;
}

// ===== KURANG =====
function buildKurang(a, b){
  const s = [];
  let isNeg = parseFloat(a) < parseFloat(b);
  let sa = isNeg ? String(b) : String(a);
  let sb = isNeg ? String(a) : String(b);
  
  const dota = sa.indexOf('.'), dotb = sb.indexOf('.');
  const intA = dota >= 0 ? sa.slice(0, dota) : sa;
  const intB = dotb >= 0 ? sb.slice(dotb+1) : sb;
  const decA = dota >= 0 ? sa.slice(dota+1) : '';
  const decB = dotb >= 0 ? sb.slice(dotb+1) : '';
  const maxDec = Math.max(decA.length, decB.length);
  const totalLen = Math.max(intA.length, intB.length) + maxDec;
  
  let strA = intA.padStart(Math.max(intA.length, intB.length), ' ') + decA.padEnd(maxDec, '0');
  let strB = intB.padStart(Math.max(intA.length, intB.length), ' ') + decB.padEnd(maxDec, '0');
  
  const rightCol = 6 + 2 * totalLen + (maxDec > 0 ? 3 : 0);
  const W = rightCol + 4;
  
  let topDigits = strA.split('').map(c => c === ' ' ? 0 : parseInt(c));
  let modified = Array(strA.length).fill(false);
  let results = Array(strA.length).fill(' ');
  
  let introTxt = isNeg ? t('kurangIntroNeg', {a,b}) : t('kurangIntro', {a,b});
  s.push({sim: a+' - '+b+' = ?', txt: introTxt});
  
  const getDisplayRow = (arr, isTopStr = false) => {
    let disp = '';
    for(let i=0; i<arr.length; i++) {
      let char = arr[i];
      if (char === ' ' || char === null || char === false) disp += '  ';
      else {
        let charStr = String(char);
        if (isTopStr && modified[i] && charStr !== ' ') {
            disp += charStr + '\u0338 '; 
        } else {
            if (charStr.length > 1) {
                disp += charStr; 
            } else {
                disp += charStr + ' ';
            }
        }
      }
      if(maxDec > 0 && i === arr.length - maxDec - 1) disp += '. ';
    }
    return disp;
  };
  
  const baseSim = () => {
    let borrowArr = Array(strA.length).fill(' ');
    for(let i=0; i<strA.length; i++){
      if(modified[i]) borrowArr[i] = topDigits[i].toString();
    }
    const cDisp = getDisplayRow(borrowArr);
    const tDisp = getDisplayRow(strA.split(''), true);
    const bDisp = getDisplayRow(strB.split(''));
    const rDisp = getDisplayRow(results);
    
    const baseDispLen = getDisplayRow(strA.split('')).length;
    
    let res = [];
    if(cDisp.trim() !== '') res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: cDisp}]));
    res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: tDisp}]));
    res.push(makeRow(W, [{pos: rightCol - baseDispLen - 2, s: '-'}, {pos: rightCol - baseDispLen, s: bDisp}]));
    const barLen = getDisplayRow(strA.split('')).trimEnd().length + 2;
    res.push(makeRow(W, [{pos: rightCol - baseDispLen - 2, s: '─'.repeat(barLen)}]));
    if(rDisp.trim() !== '') res.push(makeRow(W, [{pos: rightCol - baseDispLen, s: rDisp}]));
    return res.join('\n');
  };
  
  s.push({sim: baseSim(), txt: t('kurangMulai') });
  
  for(let i = strA.length - 1; i >= 0; i--){
    if(strA[i] === ' ' && strB[i] === ' ' && results[i] === ' ') break;
    let valA = topDigits[i];
    const valB = strB[i] === ' ' ? 0 : parseInt(strB[i]);
    
    if (valA < valB) {
      let bIdx = i - 1;
      while(bIdx >= 0 && topDigits[bIdx] === 0) bIdx--;
      if (bIdx >= 0) {
        for(let j = bIdx; j < i; j++){
          if (j === bIdx) {
            topDigits[j] -= 1;
            modified[j] = true;
          } else {
            topDigits[j] = 9;
            modified[j] = true;
          }
        }
        valA += 10;
        topDigits[i] = valA;
        modified[i] = true;
        s.push({sim: baseSim(), txt: t('kurangPinjam', {vA0:topDigits[i]-10, vB:valB, vA:valA}) });
      }
    }
    
    const diff = valA - valB;
    results[i] = diff.toString();
    
    let txt = t('kurangStep', {vA:valA, vB:valB, diff});
    s.push({sim: baseSim(), txt: txt});
  }
  
  let finalRes = results.join('').trim();
  while(finalRes.length > 1 && finalRes.startsWith('0')) {
    finalRes = finalRes.slice(1);
  }
  if (maxDec > 0) {
    if (finalRes.length <= maxDec) {
      finalRes = finalRes.padStart(maxDec + 1, '0');
    }
    finalRes = finalRes.slice(0, finalRes.length - maxDec) + '.' + finalRes.slice(finalRes.length - maxDec);
    if (finalRes.startsWith('.')) finalRes = '0' + finalRes;
  }
  if (isNeg && finalRes !== '0') finalRes = '-' + finalRes;
  
  s.push({sim: baseSim(), txt: t('kurangHasil', {a,b,res:finalRes}) });
  return s;
}

// ===== KALI =====
function buildKali(a, b){
  const s = [];
  const sa = String(a), sb = String(b);
  const decA = sa.includes('.') ? sa.length - 1 - sa.indexOf('.') : 0;
  const decB = sb.includes('.') ? sb.length - 1 - sb.indexOf('.') : 0;
  const totalDec = decA + decB;

  const strA = sa.replace('.', '');
  const strB = sb.replace('.', '');
  const intA = parseInt(strA, 10) || 0;
  const intB = parseInt(strB, 10) || 0;

  const lenA = strA.length;
  const lenB = strB.length;
  const maxProdLen = lenA + lenB;
  const rightCol = 4 + 2 * maxProdLen;
  const W = rightCol + 4;

  const posA = rightCol - 2*(lenA - 1);
  const top = makeRow(W, [{pos: posA, s: strA.split('').join(' ')}]);
  
  const posB = rightCol - 2*(lenB - 1);
  const bot = makeRow(W, [{pos: posB - 2, s: '×'}, {pos: posB, s: strB.split('').join(' ')}]);
  
  const barLen = Math.max(lenA, lenB + 1);
  const barPos = rightCol - 2*(barLen - 1);
  const bar = makeRow(W, [{pos: barPos, s: '─'.repeat(2*barLen - 1)}]);

  let dStr = totalDec > 0 ? t('kaliAbaikanKoma', {ia:intA, ib:intB}) : '';
  s.push({sim: a+' × '+b+' = ?', txt: t('kaliIntro', {a, b, dStr}) });
  s.push({sim: [top, bot, bar].join('\n'), txt: t('kaliSusun', {ia:intA, ib:intB}) });

  const parts = [];
  for(let i = strB.length-1; i >= 0; i--){
    const d = +strB[i];
    const shift = strB.length-1-i;
    const part = intA * d;
    parts.push({part, shift, d});
    
    let stepTopStr = '{' + strA.split('').join(' ') + '}';
    let stepTop = makeRow(W, [{pos: posA, s: stepTopStr}]);
    
    let arrB = strB.split('');
    arrB[i] = '[' + arrB[i] + ']';
    let stepBot = makeRow(W, [{pos: posB - 2, s: '×'}, {pos: posB, s: arrB.join(' ')}]);
    
    const rows = [stepTop, stepBot, bar];
    for(const p of parts){
      const pLen = String(p.part).length;
      const pPos = rightCol - 2*(pLen + p.shift - 1);
      rows.push(makeRow(W, [{pos: pPos, s: String(p.part).split('').join(' ')}]));
    }
    const txt = shift > 0
      ? t('kaliStepA', {ia:intA, d, part, s:shift})
      : t('kaliStepB', {ia:intA, d, part});
    s.push({sim: rows.join('\n'), txt: txt});
  }

  if(parts.length > 1){
    let total = 0;
    for(const p of parts) total += p.part * Math.pow(10, p.shift);
    const rows = [top, bot, bar];
    for(const p of parts){
      const pLen = String(p.part).length;
      const pPos = rightCol - 2*(pLen + p.shift - 1);
      rows.push(makeRow(W, [{pos: pPos, s: String(p.part).split('').join(' ')}]));
    }
    const tLen = String(total).length;
    const tBarLen = Math.max(tLen, String(parts[parts.length-1].part).length + parts[parts.length-1].shift);
    const tBarPos = rightCol - 2*(tBarLen - 1);
    rows.push(makeRow(W, [{pos: tBarPos, s: '─'.repeat(2*tBarLen - 1)}]));
    
    const tPos = rightCol - 2*(tLen - 1);
    rows.push(makeRow(W, [{pos: tPos, s: String(total).split('').join(' ')}]));
    
    let finalStr = String(total);
    if(totalDec > 0){
      finalStr = finalStr.padStart(totalDec + 1, '0');
      finalStr = finalStr.slice(0, finalStr.length - totalDec) + '.' + finalStr.slice(finalStr.length - totalDec);
    }
    
    s.push({sim: rows.join('\n'), txt: t('kaliJumlah', {tot:total}) });
    let hs = totalDec > 0 ? t('kaliKembalikan', {td:totalDec, fs:finalStr}) : t('kaliAkhir', {a,b,tot:total});
    s.push({sim: rows.join('\n'), txt: t('kaliHasil', {dStr:hs}) });
  } else {
    let total = parts.length === 1 ? parts[0].part : 0;
    let finalStr = String(total);
    if(totalDec > 0){
      finalStr = finalStr.padStart(totalDec + 1, '0');
      finalStr = finalStr.slice(0, finalStr.length - totalDec) + '.' + finalStr.slice(finalStr.length - totalDec);
    }
    const tLen = String(total).length;
    const tPos = rightCol - 2*(tLen - 1);
    let hs = totalDec > 0 ? t('kaliKembalikan', {td:totalDec, fs:finalStr}) : t('kaliAkhir', {a,b,tot:total});
    s.push({sim: [top, bot, bar, makeRow(W, [{pos: tPos, s: String(total).split('').join(' ')}])].join('\n'), txt: t('kaliHasil', {dStr:hs}) });
  }
  return s;
}

// ===== BAGI (POROGAPIT INDONESIA) =====
function buildBagi(dividend, divisor){
  const s = [];
  const decA = String(dividend).includes('.') ? String(dividend).length - 1 - String(dividend).indexOf('.') : 0;
  const decB = String(divisor).includes('.') ? String(divisor).length - 1 - String(divisor).indexOf('.') : 0;
  const shift = Math.max(decA, decB);
  
  if (shift > 0) {
    const mult = Math.pow(10, shift);
    dividend = Math.round(dividend * mult);
    divisor = Math.round(divisor * mult);
    s.push({sim: ` \n `, txt: t('bagiDesimal', {m:mult, da:dividend, db:divisor}) });
  }

  const n = String(dividend).length;
  const MAX_DEC = 5;
  const intDigits = String(dividend).split('').map(Number);
  const steps = [];
  let sisa = 0, j = 0, decCount = 0;
  while(true){
    if(j < intDigits.length){
      sisa = sisa*10 + intDigits[j];
    } else {
      if(decCount >= MAX_DEC) break;
      decCount++;
      sisa = sisa*10;
    }
    const q = Math.floor(sisa/divisor);
    const r = sisa%divisor;
    steps.push({j, sisaStr:String(sisa), q, prod:q*divisor, r, dec: j >= intDigits.length});
    sisa = r;
    j++;
    if(j >= intDigits.length && r === 0) break;
  }

  const divStr = String(divisor);
  const divLen = divStr.length;
  const basePos = divLen + 3;
  const off = c => basePos + 2*c;

  const qRow = (nSlots, decSoFar, upto) => {
    const W = basePos + 2*(nSlots + decSoFar) + 3;
    const qc = Array(W).fill(' ');
    for(let c = 0; c < nSlots; c++) qc[off(c)] = c <= upto ? steps[c].q : '_';
    if(decSoFar > 0){
      qc[off(nSlots)] = ',';
      for(let k = 1; k <= decSoFar; k++) qc[off(nSlots+k)] = steps[nSlots-1+k].q;
    }
    return qc.join('');
  };

  const renderAll = (upto) => {
    const decSoFar = Math.max(0, upto - n + 1);
    const ds = n + decSoFar;
    const W = basePos + 2*ds + 3;
    const lines = [
      qRow(n, decSoFar, upto),
      makeRow(W, [{pos:basePos-2, s:'┌'+'─'.repeat(2*ds+1)}]),
      makeRow(W, [{pos:0, s:divStr}, {pos:basePos-2, s:'│'}, {pos:basePos, s:[...intDigits, ...Array(decSoFar).fill(0)].join(' ')}])
    ];
    for(let u = 0; u <= upto; u++){
      const su = steps[u];
      const L = su.sisaStr.length;
      const left = off(su.j) - 2*(L-1);
      lines.push(makeRow(W, [{pos:left, s:su.sisaStr.split('').join(' ')}]));
      const prodStr = String(su.prod);
      lines.push(makeRow(W, [{pos:off(su.j) - 2*(prodStr.length-1), s:prodStr.split('').join(' ')}]));
      lines.push(makeRow(W, [{pos:left, s:'─'.repeat(2*L-1)}]));
      const rStr = String(su.r);
      lines.push(makeRow(W, [{pos:off(su.j) - 2*(rStr.length-1), s:rStr.split('').join(' ')}]));
    }
    return lines.join('\n');
  };

  s.push({sim: renderAll(-1), txt: t('bagiBentuk', {d:divisor, n:dividend, c:n}) });

  for(let tIdx = 0; tIdx < steps.length; tIdx++){
    const st = steps[tIdx];
    const bisa = Number(st.sisaStr) >= divisor;
    const intro = st.dec
      ? t('bagiKoma', {sisa:st.sisaStr})
      : (tIdx === 0 ? t('bagiMulai', {sisa:st.sisaStr}) : t('bagiTurun', {sisa:st.sisaStr}));
    const posStr = st.dec ? t('bagiPosKoma') : t('bagiPosAtas');
    const txtA = bisa
      ? t('bagiBisa', {sisa:st.sisaStr, d:divisor, q:st.q, pos:posStr})
      : t('bagiTakBisa', {sisa:st.sisaStr, d:divisor, pos:posStr});
    const txtB = ' ' + t('bagiKurang', {q:st.q, d:divisor, p:st.prod, sisa:st.sisaStr, r:st.r});
    const decSoFar = Math.max(0, st.j - n + 1);
    const txtC = ' ' + (st.dec
      ? t('bagiSisaKoma', {dc:decSoFar})
      : (tIdx < steps.length-1 ? t('bagiSisaLanjut', {r:st.r}) : t('bagiSisaHabis', {r:st.r})));
    s.push({sim: renderAll(tIdx), txt: intro + txtA + txtB + txtC});
  }

  const intQ = steps.slice(0, n).map(x => x.q).join('').replace(/^0+/, '') || '0';
  const decQ = steps.slice(n).map(x => x.q).join('');
  const finalQ = decQ ? intQ + ',' + decQ : intQ;
  const decTotal = steps.length - n;
  const last = steps.length - 1;
  s.push({sim: renderAll(last), txt: t('bagiHasil', {q:finalQ, ket:decQ ? t('bagiKetKoma', {dc:decTotal}) : t('bagiKetHabis')}) });
  return s;
}

// ===== STATE & CONTROL LOGIC =====
let operasi = 'tambah', steps = [], stepIdx = 0, isAutoMode = false;

function updateUI() {
  document.getElementById('titleText').textContent = t('title');
  document.getElementById('subTitle').textContent = t('subtitle');
  
  // Tabs
  document.querySelector('[data-op="tambah"]').textContent = t('tambah');
  document.querySelector('[data-op="kurang"]').textContent = t('kurang');
  document.querySelector('[data-op="kali"]').textContent = t('kali');
  document.querySelector('[data-op="bagi"]').textContent = t('bagi');
  
  // Action Buttons
  document.getElementById('btnGo').textContent = t('mulaiHitung');
  document.getElementById('btnPrev').textContent = t('mundur');
  document.getElementById('btnNext').textContent = t('lanjut');
  document.getElementById('btnReset').textContent = t('mulaiUlang');
  document.getElementById('btnVoice').textContent = isVoiceEnabled ? t('suaraOn') : t('suaraOff');
  
  // Auto button state
  const btnAuto = document.getElementById('btnAuto');
  if (isAutoMode) {
    btnAuto.textContent = t('jeda');
    btnAuto.classList.add('playing');
  } else if (stepIdx >= steps.length - 1 && steps.length > 0) {
    btnAuto.textContent = t('selesai');
    btnAuto.classList.remove('playing');
  } else {
    btnAuto.textContent = t('putarOtomatis');
    btnAuto.classList.remove('playing');
  }
  
  // Speed Slider
  document.getElementById('speedText').textContent = t('kecepatan');
  const speed = parseInt(document.getElementById('speed').value);
  document.getElementById('speedLabel').textContent = i18n[currentLang].speed[speed - 1];
  
  // Stage Title & Step Count
  const titles = {tambah:t('stageTambah'), kurang:t('stageKurang'), kali:t('stageKali'), bagi:t('stageBagi')};
  document.getElementById('stageTitle').textContent = titles[operasi] || '';
  
  if (steps.length > 0) {
    document.getElementById('stepCount').textContent = t('tahap') + ' ' + (stepIdx+1) + '/' + steps.length;
    document.getElementById('btnPrev').disabled = (stepIdx === 0);
    document.getElementById('btnNext').disabled = (stepIdx >= steps.length - 1);
  } else {
    document.getElementById('stepCount').textContent = t('tahap') + ' 0/0';
    document.getElementById('btnPrev').disabled = true;
    document.getElementById('btnNext').disabled = true;
  }
}

document.getElementById('speed').addEventListener('input', e => {
  document.getElementById('speedLabel').textContent = i18n[currentLang].speed[e.target.value - 1];
});

function stopAuto() {
  isAutoMode = false;
  if (autoStepTimer) {
    clearTimeout(autoStepTimer);
    autoStepTimer = null;
  }
  if (speechAnimTimer) {
    clearTimeout(speechAnimTimer);
    speechAnimTimer = null;
  }
  window.speechSynthesis.cancel();
  setTeacherTalking(false);
  updateUI();
}

function genSteps(shouldSpeak = true){
  const n1 = parseFloat(document.getElementById('num1').value);
  const n2 = parseFloat(document.getElementById('num2').value);
  if(isNaN(n1) || isNaN(n2)){
    alert(t('alertAngka'));
    return;
  }
  const a = Math.abs(n1), b = Math.abs(n2);

  if(operasi === 'tambah') steps = buildTambah(a, b);
  else if(operasi === 'kurang') steps = buildKurang(Math.max(a,b), Math.min(a,b));
  else if(operasi === 'kali') steps = buildKali(a, b);
  else if(operasi === 'bagi') steps = buildBagi(a, Math.max(b,1));

  stepIdx = 0;
  stopAuto();
  renderPaper(shouldSpeak);
}

function renderPaper(shouldSpeak = true){
  const paper = document.getElementById('paper');
  paper.innerHTML = '';
  
  for(let i = 0; i <= stepIdx && i < steps.length; i++){
    const st = steps[i];
    const div = document.createElement('div');
    div.className = 'step-block' + (i === stepIdx ? ' current' : '');
    const simText = esc(st.sim);
    div.innerHTML = `<div class="step-sim">${animateDigits(simText)}</div><div class="step-txt">${esc(st.txt)}</div>`;
    paper.appendChild(div);
  }
  
  // Teacher Speech & Animation
  if(steps.length > 0 && stepIdx >= 0 && stepIdx < steps.length) {
    const speechText = steps[stepIdx].txt;
    document.getElementById('teacherSpeech').textContent = speechText;
    if (shouldSpeak) {
      speakText(speechText);
    }
  }
  
  updateUI();
  paper.scrollTop = paper.scrollHeight;
}

function animateDigits(text){
  let digitCount = 0;
  text = text.replace(/\{([^}]+)\}/g, '<span class="highlight-top">$1</span>');
  text = text.replace(/\[([^\]]+)\]/g, '<span class="highlight-bot">$1</span>');
  
  return text.replace(/(\d)\u0338?/g, (m, d) => {
    let isStrike = m.length > 1;
    let cls = isStrike ? "digit strike" : "digit";
    return `<span class="${cls}" style="animation-delay:${digitCount++ * 0.08}s">${d}</span>`;
  });
}

// User Manual Step Navigation
function nextStep(){
  if(stepIdx < steps.length - 1){
    stopAuto();
    stepIdx++;
    renderPaper(true);
    playClick();
  } else if(stepIdx === steps.length - 1){
    playSuccess();
  }
}

function prevStep(){
  if(stepIdx > 0){
    stopAuto();
    stepIdx--;
    renderPaper(true);
    playClick();
  }
}

function resetSim(){
  stopAuto();
  stepIdx = 0;
  renderPaper(true);
  playClick();
}

// User Continuous Auto-Play Navigation
function startAutoPlay(){
  if(steps.length === 0) {
    genSteps(true);
  }
  isAutoMode = true;
  if(stepIdx >= steps.length - 1){
    stepIdx = 0;
  }
  renderPaper(true);
}

function toggleAutoPlay(){
  if(isAutoMode){
    stopAuto();
  } else if(stepIdx >= steps.length - 1){
    resetSim();
    startAutoPlay();
  } else {
    startAutoPlay();
  }
}

// ===== CONTROLS & EVENT LISTENERS =====
// Primary "Mulai Hitung" Button
document.getElementById('btnGo').addEventListener('click', () => {
  genSteps(true);
  playClick();
});

// Step Navigation Buttons
document.getElementById('btnPrev').addEventListener('click', prevStep);
document.getElementById('btnNext').addEventListener('click', nextStep);
document.getElementById('btnAuto').addEventListener('click', toggleAutoPlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

// Voice ON/OFF Toggle
document.getElementById('btnVoice').addEventListener('click', function() {
  isVoiceEnabled = !isVoiceEnabled;
  this.classList.toggle('off', !isVoiceEnabled);
  this.textContent = isVoiceEnabled ? t('suaraOn') : t('suaraOff');
  if(!isVoiceEnabled) {
    window.speechSynthesis.cancel();
    setTeacherTalking(false);
  } else if (steps.length > 0 && stepIdx >= 0 && stepIdx < steps.length) {
    speakText(steps[stepIdx].txt);
  }
});

// Sensei Avatar Click to repeat current step speech
document.getElementById('teacherAvatar').addEventListener('click', () => {
  if (steps.length > 0 && stepIdx >= 0 && stepIdx < steps.length) {
    speakText(steps[stepIdx].txt);
  } else {
    speakText(t('greet'));
  }
});

// Language Switcher Buttons
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    stopAuto();
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentLang = this.dataset.lang;
    
    if(steps.length > 0) {
      genSteps(false);
    }
    updateUI();
    
    // Speak energetic language-specific greeting immediately
    const greeting = t('greet');
    document.getElementById('teacherSpeech').textContent = greeting;
    speakText(greeting, currentLang);
    playClick();
  });
});

// Operations Tabs (+, -, ×, ÷)
document.querySelectorAll('.tab').forEach(tBtn => {
  tBtn.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    operasi = this.dataset.op;
    
    const labels = {tambah:'+', kurang:'-', kali:'×', bagi:'÷'};
    document.getElementById('opLabel').textContent = labels[operasi];
    document.getElementById('num1').value = {tambah:256, kurang:543, kali:34, bagi:1449}[operasi];
    document.getElementById('num2').value = {tambah:178, kurang:287, kali:12, bagi:7}[operasi];
    
    stopAuto();
    steps = [];
    stepIdx = 0;
    genSteps(true);
    playClick();
  });
});

// Input keyboard Enter triggers
document.getElementById('num1').addEventListener('keypress', e => {
  if(e.key === 'Enter'){ genSteps(true); playClick(); }
});
document.getElementById('num2').addEventListener('keypress', e => {
  if(e.key === 'Enter'){ genSteps(true); playClick(); }
});

// Initial Setup
genSteps(false);
updateUI();

// AudioContext & SpeechSynthesis unlocking
document.body.addEventListener('click', unlockAudio);
document.body.addEventListener('touchstart', unlockAudio);
</script>
